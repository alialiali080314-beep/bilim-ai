if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=1280x720,auto
    load_video
    insmod gfxterm
    insmod png
    terminal_output gfxterm
fi

set background_color=black
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

set default=0
set timeout=5

menuentry "BilimOS 1.0 ARM64 Live" --class bilimos --class gnu-linux --class gnu --class os {
    linux   /live/vmlinuz boot=live components quiet splash
    initrd  /live/initrd.img
}

menuentry "BilimOS 1.0 ARM64 Live (безопасный режим)" --class bilimos --class gnu-linux {
    linux   /live/vmlinuz boot=live components nomodeset
    initrd  /live/initrd.img
}

menuentry "UEFI Firmware Settings" --class settings {
    fwsetup
}
